<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LazyOS</title>
    <link rel="icon" type="image/png" href="./Resources/LAZY.png">
    <link rel="stylesheet" href="OsMainPage.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="top-bar">
        <div class="top-bar-content">
            <div id="left">LazyOS</div>
            <div id="middle">Always learning</div>
            <div id="right"><p id="time">00:00:00</p></div>
        </div>
    </div>

    <div id="middle-bar-for-quote">Motivational Quote</div>

    <div class="desktop">

            <div id="start-window-start-button" class="start-button"></div>

            <div id="start-window" class="window">
                <div class="window-header" id="start-windowheader">Welcome</div>
                <div class="close-btn" id="start-windowclose">&times</div>
                <div class="close-btn-2"></div>
                <div class="close-btn-3"></div>
                <div id="lazy-person"></div>
                <h1 class="welcome-text">Welcome to LazyOS</h1>
                <p class="welcome-text">This is build by <b>lazy people</b></p>
                <p class="welcome-text">And</p>
                <p class="welcome-text">it serves lazy people</p>
            </div>
            
            
            <div id="note-start-button" class="start-button"></div>

            <div id="note" class="window">
                <div class="window-header" id="noteheader">Notes</div>
                <div class="close-btn" id="noteclose">&times</div>
                <div class="close-btn-2"></div>
                <div class="close-btn-3"></div>
                
                
                <div id="change-note-book">
                    <div class="note-book-tab" id="dev-log-tab">Dev Log</div>
                    <div class="note-book-tab" id="user-take-note-tab">Take Note</div>
                    <div class="note-book-tab" id="user-save-note-tab">Saved Notes</div>
                </div>
                <div class="note-book" id="display-blank"></div>
                <div class="note-book" id="dev-log">pending...</div>
                <div class="note-book" id="user-take-note">
                    <textarea id="note-textarea" placeholder="Write your note here..."></textarea>
                </div>
                <div class="note-book" id="user-save-note">pending...</div>
                
            </div>


            <div id="gallery-start-button" class="start-button"></div>

            <div id="gallery" class="window">
                <div class="window-header" id="galleryheader">Gallery</div>
                <div class="close-btn" id="galleryclose">&times</div>
                <div class="close-btn-2"></div>
                <div class="close-btn-3"></div>
                <div id="photo-name">---</div>
                <div id="photo-show-main-contener">
                    <div id="previous-photo" class="photo-change">+</div>
                    <div id="photo-display"></div>
                    <div id="next-photo" class="photo-change">+</div>
                </div>

            </div>


            <div id="clock-start-button" class="start-button"></div>

            <div id="clock" class="window">
                <div class="window-header" id="clockheader">Clock</div>
                <div class="close-btn" id="clockclose">&times</div>
                <div class="close-btn-2"></div>
                <div class="close-btn-3"></div>

                <div id="clock-body"><span id="clock-hours">00</span><span id="clock-colon">:</span><span id="clock-munite">00</span></div>

            </div>

            <div id="message-start-button" class="start-button"></div>

            <div id="message" class="window">
                <div class="window-header" id="messageheader">Message</div>
                <div class="close-btn" id="messageclose">&times</div>
                <div class="close-btn-2"></div>
                <div class="close-btn-3"></div>

                <div id="message-box">
                    sorry, its pending...
                </div>

            </div>
            </div>

            <div id="music-start-button" class="start-button"></div>

            <div id="music" class="window">
                <div class="window-header" id="musicheader">Music</div>
                <div class="close-btn" id="musicclose">&times</div>
                <div class="close-btn-2"></div>
                <div class="close-btn-3"></div>

                <div id="music-box">
                    <div id="cd"></div>
                    <div id="player">
                            <button class="music-ctrl-btn" id="prev-btn">&#9198;</button>
                            <button class="music-ctrl-btn" id="play-pause-btn">&#9654;</button>
                            <button class="music-ctrl-btn" id="next-btn">&#9197;</button>
                    </div>
                    
                </div>

            </div>


            <div id="browser-start-button" class="start-button"></div>

            <div id="browser" class="window">
                <div class="window-header" id="browserheader">Browser</div>
                <div class="close-btn" id="browserclose">&times</div>
                <div class="close-btn-2"></div>
                <div class="close-btn-3"></div>

                <div id="search-bar-holder">
                    <input type="text" id="search-bar"  placeholder="Search...">
                    <button id="search-btn">&#128269;</button>
                </div>

            </div>

            <div id="calculator-start-button" class="start-button"></div>

            <div id="calculator" class="window">
                <div class="window-header" id="calculatorheader">Calculator</div>
                <div class="close-btn" id="calculatorclose">&times</div>
                <div class="close-btn-2"></div>
                <div class="close-btn-3"></div>

                <div id="cal-body">
                    
                    <input type="text" id="cal-display" disabled>
                    <div id="cal-buttons">
                        <button class="cal-btn" data-value="7">7</button>
                        <button class="cal-btn" data-value="8">8</button>
                        <button class="cal-btn" data-value="9">9</button>
                        <button class="cal-btn" data-value="/">/</button>
                        <button class="cal-btn" data-value="4">4</button>
                        <button class="cal-btn" data-value="5">5</button>
                        <button class="cal-btn" data-value="6">6</button>
                        <button class="cal-btn" data-value="*">*</button>
                        <button class="cal-btn" data-value="1">1</button>
                        <button class="cal-btn" data-value="2">2</button>
                        <button class="cal-btn" data-value="3">3</button>
                        <button class="cal-btn" data-value="-">-</button>
                        <button class="cal-btn" data-value="0">0</button>
                        <button class="cal-btn" data-value=".">.</button>
                        <button class="cal-btn" data-value="=">=</button>
                        <button class="cal-btn" data-value="+">+</button>
                        <button class="cal-btn" data-value="C">C</button>
                    </div>
                </div>
            </div>

</body>
</html>
