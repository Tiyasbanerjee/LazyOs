<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LazyOS</title>
    <link rel="stylesheet" href="OsMainPage.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="top-bar">
        <div class="top-bar-content">
            <div id="left">LazyOS</div>
            <div id="middle">Always learning</div>
            <div id="right"><p id="time">00:00:00</p></div>
        </div>
    </div>

    <div class="desktop">

            <div id="start-window-start-button" class="start-button"></div>

            <div id="start-window" class="window">
                <div class="window-header" id="start-windowheader">LazyOS</div>
                <div class="close-btn" id="start-windowclose">&times</div>
                <div class="close-btn-2"></div>
                <div class="close-btn-3"></div>
                <div id="lazy-person"></div>
                <h1 class="welcome-text">Welcome to LazyOS</h1>
                <p class="welcome-text">This is build by <b>lazy people</b></p>
                <p class="welcome-text">And</p>
                <p class="welcome-text">it serves lazy people</p>
            </div>
            
            
            <div id="note-start-button" class="start-button"></div>

            <div id="note" class="window">
                <div class="window-header" id="noteheader">LazyOS</div>
                <div class="close-btn" id="noteclose">&times</div>
                <div class="close-btn-2"></div>
                <div class="close-btn-3"></div>
                <div id="note-book">

                </div>
            </div>


            <div id="wallpaper-start-button" class="start-button"></div>

            <div id="wallpaper" class="window">
                <div class="window-header" id="wallpaperheader">LazyOS</div>
                <div class="close-btn" id="wallpaperclose">&times</div>
                <div class="close-btn-2"></div>
                <div class="close-btn-3"></div>
            </div>


            <div id="music-start-button" class="start-button"></div>

            <div id="music" class="window">
                <div class="window-header" id="musicheader">LazyOS</div>
                <div class="close-btn" id="musicclose">&times</div>
                <div class="close-btn-2"></div>
                <div class="close-btn-3"></div>
            </div>

            <div id="calculator-start-button" class="start-button"></div>

            <div id="calculator" class="window">
                <div class="window-header" id="calculatorheader">LazyOS</div>
                <div class="close-btn" id="calculatorclose">&times</div>
                <div class="close-btn-2"></div>
                <div class="close-btn-3"></div>
            </div>

    </div>

</body>
</html>
